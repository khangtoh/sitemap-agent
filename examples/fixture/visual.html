<!doctype html><html><head><meta charset="utf-8"><title>Site map</title><style>body{font:14px system-ui;margin:1rem;display:grid;grid-template-columns:1fr 320px;gap:1rem}input{grid-column:1/3;padding:.5rem}ul{list-style:none;padding-left:1.2rem}.node{cursor:pointer;padding:2px}.bad{color:#b42318}.multi{font-size:.75em;background:#eee;border-radius:8px;padding:1px 5px}aside{white-space:pre-wrap;border-left:1px solid #ddd;padding-left:1rem}</style></head><body><h1>Site map</h1><input id="filter" placeholder="Filter paths"><main id="tree"></main><aside id="detail">Select a page</aside><script id="sitemap-data" type="application/json">{
  "baseDomain": "fixture.local",
  "crawlMeta": {
    "durationMs": 1,
    "errorCount": 0,
    "maxDepth": 2,
    "maxPages": null,
    "pageCount": 3
  },
  "generatedAt": "2026-08-30T00:00:00.000Z",
  "nodes": {
    "http://fixture.local/": {
      "children": [
        "http://fixture.local/a",
        "http://fixture.local/b"
      ],
      "contentType": "text/html",

      "discoveredAt": "2026-08-30T00:00:00.000Z",
      "error": null,
      "parents": [],
      "path": "/",
      "status": 200,
      "title": "Root",
      "url": "http://fixture.local/"
    },
    "http://fixture.local/a": {
      "children": [],
      "contentType": "text/html",
      "depth": 1,
      "discoveredAt": "2026-08-30T00:00:00.000Z",
      "error": null,
      "parents": [
        "http://fixture.local/"
      ],
      "path": "/a",
      "status": 200,
      "title": "A",
      "url": "http://fixture.local/a"
    },
    "http://fixture.local/b": {
      "children": [],
      "contentType": "text/html",
      "depth": 1,
      "discoveredAt": "2026-08-30T00:00:00.000Z",
      "error": null,
      "parents": [
        "http://fixture.local/"
      ],
      "path": "/b",
      "status": 200,
      "title": "B",
      "url": "http://fixture.local/b"
    }
  },
  "startUrl": "http://fixture.local/"
}
</script><script>const g=JSON.parse(document.getElementById('sitemap-data').textContent),tree=document.getElementById('tree'),detail=document.getElementById('detail'),filter=document.getElementById('filter');function label(n){return n.path==='/'?'/':n.path.split('/').filter(Boolean).pop()}function draw(){let q=filter.value.toLowerCase(),seen=new Set;function branch(u){let n=g.nodes[u];if(!n||seen.has(u)||q&&!n.path.toLowerCase().includes(q))return '';seen.add(u);let bad=n.error||!n.status||n.status<200||n.status>=300,more=Math.max(0,n.parents.length-1),kids=n.children.map(branch).filter(Boolean).join('');return '<li><span class="node '+(bad?'bad':'')+'" data-u="'+encodeURIComponent(u)+'">'+label(n)+(more?' <b class="multi">+'+more+' parent</b>':'')+'</span>'+ (kids?'<ul>'+kids+'</ul>':'')+'</li>'}tree.innerHTML='<ul>'+branch(g.startUrl)+'</ul>';tree.querySelectorAll('.node').forEach(e=>e.onclick=()=>{let n=g.nodes[decodeURIComponent(e.dataset.u)];detail.textContent=JSON.stringify(n,null,2);let ul=e.parentElement.querySelector(':scope>ul');if(ul)ul.hidden=!ul.hidden})}filter.oninput=draw;draw()</script></body></html>
