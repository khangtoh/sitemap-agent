</script><script>const buildTreeHtml = function buildTreeHtml(graph, query) {
  const q = query.toLowerCase(), seen = new Set;
  function label(node) {
    return node.path === "/" ? "/" : node.path.split("/").filter(Boolean).pop() ?? "/";
  }
  function branch(url) {
    const node = graph.nodes[url];
    if (!node || seen.has(url))
      return "";
    seen.add(url);
    const kids = node.children.map(branch).filter(Boolean).join(""), hit = !q || node.path.toLowerCase().includes(q);
    if (!hit && !kids) {
      seen.delete(url);
      return "";
    }
    const bad = node.error || !node.status || node.status < 200 || node.status >= 300, more = Math.max(0, node.parents.length - 1);
    return '<li><span class="' + ("node" + (bad ? " bad" : "") + (hit ? "" : " faded")) + '" data-u="' + encodeURIComponent(url) + '">' + label(node) + (more ? ' <b class="multi">+' + more + " parent</b>" : "") + "</span>" + (kids ? "<ul>" + kids + "</ul>" : "") + "</li>";
  }
  return "<ul>" + branch(graph.startUrl) + "</ul>";
};
const g=JSON.parse(document.getElementById('sitemap-data').textContent),tree=document.getElementById('tree'),detail=document.getElementById('detail'),filter=document.getElementById('filter');
function draw(){tree.innerHTML=buildTreeHtml(g,filter.value);tree.querySelectorAll('.node').forEach(e=>e.onclick=()=>{detail.textContent=JSON.stringify(g.nodes[decodeURIComponent(e.dataset.u)],null,2);const ul=e.parentElement.querySelector(':scope>ul');if(ul)ul.hidden=!ul.hidden})}
